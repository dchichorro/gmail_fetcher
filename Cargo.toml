[package]
name = "gmail_fetcher"
version = "0.4.0"
edition = "2021"

[lib]
name = "gmail_fetcher"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oauth2 = { version = "5.0", features = ["reqwest"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tokio-stream = "0.1"
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
clap = { version = "4", features = ["env", "derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
shared_db = { path = "../shared-db" }
